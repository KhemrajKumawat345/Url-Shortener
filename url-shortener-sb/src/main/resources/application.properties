spring.application.name=url-shortener-sb

spring.datasource.url = ${DATABASE_URL}
spring.datasource.username = ${DATABASE_USERNAME}
spring.datasource.password = ${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect = ${DATABASE_DIALECT}
# in the java code we doesn't write the sql query. query is generated by the help of jpa and hibernate. for auto generated the
# query we have to tell to spring boot which dialect we want to use.

jwt.secret = ${JWT_SECRET}
jwt.expiration = 172800000

logging.level.org.springframework.security = DEBUG
logging.level.org.url.shortener = DEBUG
logging.leve.org.springframework.web = DEBUG
logging.leve.org.springframework = DEBUG
logging.leve.org.springframework.web.servlet = DEBUG

#frontend.url = ${FRONTEND_URL}
frontend.url = ${FRONTEND_URL:http://localhost:5173}
#take value of FRONTEND_URL, if not available then use localhost:5173 as default
